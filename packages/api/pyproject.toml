[tool.poetry]
name = "post-generator-api"
version = "0.1.0"
description = "Python FastAPI replacement for the Post Generator API"
authors = ["Post Generator <dev@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.95.2"
uvicorn = {extras = ["standard"], version = "^0.22.0"}
python-dotenv = "^1.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
